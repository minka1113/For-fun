# Builds the app image, pushes it to ECR and rolls it out to the EC2 instance via SSM.
# No AWS keys are stored in GitHub: it assumes an IAM role through OIDC.
# One-time setup (repo variables AWS_DEPLOY_ROLE_ARN / AWS_REGION): see infrastructure/docs/DEPLOY.md
name: Deploy

on:
  push:
    branches: [web]
    paths-ignore:
      - "home-maintenance/**" # deployed by deploy-home.yml
      - ".github/workflows/deploy-home.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC to AWS

env:
  ECR_REPOSITORY: source-lense
  SSM_DOCUMENT: source-lense-deploy
  INSTANCE_TAG: source-lense

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # `npm run build` (typecheck + vite build) runs inside the Docker build, so a type error fails the deploy.
      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --targets "Key=tag:Name,Values=$INSTANCE_TAG" \
            --parameters "imageTag=${GITHUB_SHA}" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          for i in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query 'CommandInvocations[].CommandPlugins[].Output' --output text
                exit 1 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "timed out waiting for deploy"; exit 1; }
          aws ssm list-command-invocations --command-id "$CMD_ID" --details \
            --query 'CommandInvocations[].CommandPlugins[].Output' --output text
